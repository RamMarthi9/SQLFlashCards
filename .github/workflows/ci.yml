name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sqlflashcards
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: sqlflashcards_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlflashcards -d sqlflashcards_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sqlflashcards:ci-test-password@127.0.0.1:5432/sqlflashcards_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check application
        run: npm run check

  backup-restore:
    name: Encrypted backup and restore
    runs-on: ubuntu-latest
    container: postgres:17-bookworm
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sqlflashcards
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: sqlflashcards_backup_test
        options: >-
          --health-cmd "pg_isready -U sqlflashcards -d sqlflashcards_backup_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: sqlflashcards
      PGPASSWORD: ci-test-password
      TEST_DATABASE_URL: postgresql://sqlflashcards:ci-test-password@postgres:5432/sqlflashcards_backup_test?sslmode=disable
      TEST_RESTORE_DATABASE_URL: postgresql://sqlflashcards:ci-test-password@postgres:5432/sqlflashcards_restore_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Create disposable restore database
        run: createdb sqlflashcards_restore_test
      - name: Verify encrypted backup and empty-target restore
        run: node scripts/backup-integration.mjs
